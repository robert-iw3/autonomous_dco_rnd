<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sentinel Nexus -- Operations HUD</title>
		<!--
			No external font fetch. The enclave is zero-egress, so a request to
			fonts.googleapis.com cannot succeed here; it only stalls first paint and
			signals an outbound attempt from an isolated network. Type falls back to
			the platform monospace stack below. To restore the exact typeface, vendor
			the IBM Plex Mono woff2 files into static/ and @font-face them locally.
		-->
		%sveltekit.head%
		<style>
			body { background-color: #050505; color: #e2e8f0; overflow: hidden; }
			::-webkit-scrollbar { width: 5px; height: 5px; }
			::-webkit-scrollbar-track { background: transparent; }
			::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
			::-webkit-scrollbar-thumb:hover { background: #334155; }
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
