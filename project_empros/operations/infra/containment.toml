# Azure snapshot_volume / revoke_instance_role and GCP revoke_instance_role are
# intentionally NOT declared: the Azure NSG runbook and the GCP function do not
# implement them yet. Declaring an action whose executor silently no-ops it would
# let the containment protocol record evidence-preservation / role-revocation as
# done when it never ran. The capability matrix omits these too, so the planner
# escalates that entity to an operator rather than dispatching a dead step.
# (See tests/lab_operations_contracts/test_containment_action_vocabulary.py.)

[providers.gcp_containment_v1.actions.snapshot_volume]
method = "POST"
endpoint = "${GCP_ISOLATE_FUNCTION_URL}"
headers = { "Content-Type" = "application/json", "X-Nexus-Signature" = "${NEXUS_HMAC_SECRET}" }
timeout_seconds = 120
retryable = true
success_codes = [200]
body_template = """
{
  "incident_id": "{{incident_id}}",
  "target_ip":   "{{target}}",
  "action":      "snapshot_volume"
}
"""

[providers.gcp_containment_v1.actions.snapshot_volume.validation]
required_fields = ["target", "incident_id"]
target_format = "any"

# ==============================================================================
# Kubernetes containment: cordon the node, quarantine the pod with a deny-all
# NetworkPolicy, or kill the pod. One n8n K8s_Containment workflow routes by
# action; uncordon_node reverses a cordon on an FP-flip.
# ==============================================================================
[providers.k8s_containment_v1.actions.cordon_node]
method = "POST"
endpoint = "http://n8n:5678/webhook/k8s-containment"
headers = { "Content-Type" = "application/json" }
timeout_seconds = 60
retryable = true
success_codes = [200, 202]
body_template = """
{
  "incident_id": "{{incident_id}}",
  "target":      "{{target}}",
  "action":      "cordon_node"
}
"""

[providers.k8s_containment_v1.actions.cordon_node.validation]
required_fields = ["target", "incident_id"]
target_format = "any"

