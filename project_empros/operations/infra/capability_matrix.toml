# ==============================================================================
# Containment Capability Contract
#
# Single source of truth the swarm's containment planner reads so every planned
# step is EXECUTABLE in the target's environment. Keyed by (target_class, environment, action). Only
# actions listed here may be planned; a (target_class, environment) with no entry
# is intentionally uncovered -> the coverage gate escalates it to an operator
# rather than emitting an action no executor can run.
#
# Reconciled against operations/infra/containment.toml + the on-host
# response_executor allowlist by tests/lab_operations_contracts/test_containment_capability.py.
#
# Fields:
#   target_class    endpoint | cloud_instance | container | identity | network | saas | datastore
#   environment     windows|linux | aws|azure|gcp|vmware | k8s | entra|iam|gcp|local | onprem | m365|gws|okta
#   action          the containment verb
#   executor        agent_task_v1 | <provider>_containment_v1 | custom_fw_v1 | ... (must exist downstream)
#   wave            1 = contain + capture volatile evidence - 2 = eradicate (held until certainty)
#   certainty_floor malicious < corroborated < confirmed  (per-entity assurance gate)
#   reversible_by   the rollback action for an FP-flip ("" = irreversible / N/A)
#   required        params the executor needs present on the step
# ==============================================================================

capability = [
  # -- endpoint - windows --
  { target_class="endpoint", environment="windows", action="collect_forensics",    executor="agent_task_v1", wave=1, certainty_floor="malicious",    reversible_by="",            required=["target","incident_id"] },
